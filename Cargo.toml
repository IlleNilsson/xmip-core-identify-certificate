[package]
name = "xmip-core-identify-certificate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify-certificate"
description = "Identify by certificate: reads the peer certificate's subject and issuer off the connection, unverified, with the chain riding as proof for the second gate. A xmip-core-identify technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The mechanism is xmip-core's, declared once for the
# identify technology and its authenticate sibling (ADR-0050).
identify = { workspace = true }
# The names the transport writes on the arrival (context::property).
context = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
